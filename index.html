<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pedidos y Clientes ML</title>
  <meta name="theme-color" content="#EEF2F7">
  <link rel="manifest" href="./manifest.json">

  <style>
    /* ═══════════════════════════════════════════════════════
       SHELL — Mercado Limpio (Clientes + Pedidos)
       El dock ocupa espacio REAL de layout: nunca tapa las apps.
       Se esconde solo cuando el vendedor escribe (auto-hide).
       ═══════════════════════════════════════════════════════ */
    :root {
      --bg:        #EEF2F7;
      --dock-bg:   #FFFFFF;
      --border:    rgba(12, 20, 30, 0.10);
      --muted:     #8A94A2;
      --text:      #0E1620;
      --clientes:  #2E6BFF;   /* acento app Clientes (azul) */
      --pedidos:   #0BB37B;   /* acento app Pedidos (esmeralda) */
      --ink:       #04140E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0A0E14;
        --dock-bg: #10161F;
        --border:  rgba(255, 255, 255, 0.10);
        --muted:   #7C8794;
        --text:    #EAF0F6;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      /* Columna: escenario (flex:1) + dock (en flujo) → el dock NUNCA tapa.
         Alto = SOLO lo visible. Nada de min-height:100vh: en celulares el
         vh mide la ventana con la barra de URL oculta (más alto que lo
         visible) y empujaba el dock y el fondo de las apps fuera de la
         pantalla, sin scroll posible (overflow hidden). El fallback si no
         hay dvh es el height:100% de arriba. */
      display: flex;
      flex-direction: column;
      height: 100dvh;              /* alto visible real (acompaña la UI del navegador) */
      background: var(--bg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── ESCENARIO: las dos apps ── */
    #stage { flex: 1 1 auto; position: relative; min-height: 0; }
    /* La capa inactiva sale del layout con DISPLAY:NONE — no apilada por
       encima con position:absolute/opacity. Esa superposición (probada
       antes con visibility:hidden) arreglaba el iOS-bug de iframes que
       comían el táctil, pero seguía dejando DOS iframes en el mismo
       espacio de layout; en Android esa combinación (absolute+inset:0
       dentro de un flex con min-height:0) es un patrón conocido de
       problemas de scroll/touch. display:none saca al iframe inactivo
       por completo del árbol de render — sin ambigüedad en ninguna
       plataforma — y el activo ocupa el contenedor de forma normal
       (sin position:absolute). Se pierde el fundido entre apps; se
       prioriza que el scroll/táctil sea 100% confiable en todos lados.
       El estado de cada app se conserva igual (el iframe no se recarga,
       solo deja de estar en el árbol visual). */
    .app-layer {
      display: none;
      width: 100%; height: 100%;
      border: 0;
      background: var(--bg);
    }
    .app-layer.active { display: block; }

    /* ── DOCK compacto (en el flujo del layout) ── */
    #dock {
      flex: 0 0 auto;
      background: var(--dock-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 18px rgba(10, 20, 30, 0.06);
      padding: 0 10px calc(5px + env(safe-area-inset-bottom, 0px));
    }

    /* Tirita para minimizar/expandir — parte del dock, no flota sobre la app.
       Discreta con el banner abierto; llamativa (naranja + pulso) cuando
       está oculto, para que sea fácil de encontrar y volver a desplegar. */
    .grab {
      height: 17px;
      margin: 0 -10px;                 /* ancho completo, ignora el padding lateral */
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.3s, height 0.3s;
    }
    #dock.collapsed .grab { height: 24px; }   /* oculto: más alta para el dedo */
    .grab-pill {
      width: 40px; height: 4px;
      border-radius: 999px;
      background: var(--border);
      position: absolute;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .grab svg {
      width: 15px; height: 15px;
      stroke: var(--muted); stroke-width: 2.5; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.3s, stroke 0.3s;
      position: relative;
    }
    #dock.collapsed .grab svg { transform: rotate(180deg); }

    /* Oculto: la manija se vuelve un faro naranja con pulso suave */
    #dock.collapsed .grab {
      background: #FFB020;
      box-shadow: 0 -2px 16px rgba(255, 176, 32, 0.55);
      animation: grabGlow 2.2s ease-in-out infinite;
    }
    #dock.collapsed .grab-pill { background: rgba(4, 20, 14, 0.35); }
    #dock.collapsed .grab svg  { stroke: #1A1300; }
    @keyframes grabGlow {
      0%, 100% { box-shadow: 0 -2px 16px rgba(255, 176, 32, 0.40); }
      50%      { box-shadow: 0 -5px 26px rgba(255, 176, 32, 0.85); }
    }

    /* Botonera compacta (ícono + texto en fila) — colapsa a 0 sin salirse del flujo */
    .dock-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      height: 44px;
      overflow: hidden;
      transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #dock.collapsed .dock-btns { height: 0; }

    .nav-btn {
      background: transparent; border: none;
      color: var(--muted);
      font-family: inherit; font-weight: 800; font-size: 11.5px;
      letter-spacing: 0.07em; text-transform: uppercase;
      display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 7px;
      cursor: pointer; position: relative;
      height: 100%;
      border-radius: 12px;
      transition: color 0.2s, background 0.2s;
    }
    .nav-btn svg {
      width: 19px; height: 19px;
      stroke: currentColor; stroke-width: 2.1; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.15s;
    }
    .nav-btn:active { transform: scale(0.97); }
    .nav-btn:active svg { transform: scale(0.92); }

    /* Activo: píldora de color, limpia y moderna */
    .nav-btn.on-clientes {
      color: var(--clientes);
      background: rgba(46, 107, 255, 0.12);
      box-shadow: inset 0 0 0 1px rgba(46, 107, 255, 0.25);
    }
    .nav-btn.on-pedidos {
      color: var(--pedidos);
      background: rgba(11, 179, 123, 0.14);
      box-shadow: inset 0 0 0 1px rgba(11, 179, 123, 0.28);
    }

    /* Badge: pedidos en cola sin sincronizar */
    .badge {
      position: absolute;
      top: 4px; right: 10px;
      min-width: 16px; height: 16px;
      padding: 0 4px;
      background: #FF5D5D; color: #fff;
      border-radius: 999px;
      font-size: 9.5px; font-weight: 800;
      display: none;
      align-items: center; justify-content: center;
      line-height: 1;
    }
    .badge.show { display: flex; }

    /* ══ Instalar la app (Android/iOS) — vive en el shell: se instala el contenedor ══ */
    /* Barra fina sobre el dock: aparece SIEMPRE (fuera de la app instalada) hasta que instalen */
    #install-bar {
      flex: 0 0 auto;
      display: none;
      align-items: center; gap: 8px;
      padding: 9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
      background: var(--clientes); color: #fff;
      font-family: inherit; font-weight: 800; font-size: 12.5px; letter-spacing: 0.02em;
    }
    #install-bar.show { display: flex; }
    #install-bar .ib-txt { flex: 1; line-height: 1.3; }
    #install-bar button { flex: 0 0 auto; font-family: inherit; cursor: pointer; border: 0; }
    #install-bar .ib-go {
      background: #fff; color: var(--clientes);
      border-radius: 999px; padding: 7px 15px;
      font-weight: 900; font-size: 12px;
    }
    #install-bar .ib-x {
      background: transparent; color: rgba(255,255,255,.9);
      padding: 6px 4px; font-size: 17px; line-height: 1;
    }

    /* Modal primera vez */
    #install-modal {
      position: fixed; inset: 0; z-index: 9999;
      display: none; align-items: center; justify-content: center;
      background: rgba(4, 12, 20, 0.55); padding: 24px;
    }
    #install-modal.show { display: flex; }
    #install-modal .card {
      background: var(--dock-bg); color: var(--text);
      border-radius: 22px; padding: 24px 22px;
      max-width: 340px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    #install-modal img { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 14px; display: block; }
    #install-modal h2 { font-size: 19px; font-weight: 900; margin-bottom: 6px; }
    #install-modal p  { font-size: 13.5px; color: var(--muted); line-height: 1.5; margin-bottom: 18px; }
    #install-modal .im-go {
      width: 100%; background: var(--clientes); color: #fff;
      border: 0; border-radius: 14px; padding: 14px;
      font-family: inherit; font-weight: 900; font-size: 14px; cursor: pointer; margin-bottom: 8px;
    }
    #install-modal .im-manual {
      display: none; text-align: left;
      font-size: 12.5px; color: var(--muted); line-height: 1.5;
      background: var(--bg); border-radius: 12px; padding: 12px; margin-bottom: 8px;
    }
    #install-modal .im-later {
      width: 100%; background: transparent; color: var(--muted);
      border: 0; padding: 10px; font-family: inherit; font-weight: 800; font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ═══ ESCENARIO: las dos apps (misma origin en producción) ═══ -->
  <div id="stage">
    <iframe id="app-clientes" class="app-layer"
      data-src="https://pablosantamaria26.github.io/app-vendedores/"
      allow="geolocation; microphone; camera; fullscreen"></iframe>

    <iframe id="app-pedidos" class="app-layer"
      data-src="https://pablosantamaria26.github.io/App-Pedidos-ML/index.html"
      allow="geolocation; microphone; camera; fullscreen"></iframe>
  </div>

  <!-- ═══ BARRA INSTALAR (Android/iOS): sobre el dock, hasta que instalen ═══ -->
  <div id="install-bar">
    <span class="ib-txt">Instalá la app: abre al toque y sin buscar el link</span>
    <button type="button" class="ib-go" id="ib-go">Instalar</button>
    <button type="button" class="ib-x" id="ib-x" aria-label="Cerrar">&times;</button>
  </div>

  <!-- ═══ DOCK (en el layout: nunca tapa la app) ═══ -->
  <nav id="dock">
    <div class="grab" onclick="toggleDock()" title="Ocultar / mostrar barra">
      <span class="grab-pill" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="dock-btns">
      <button id="btn-clientes" class="nav-btn" onclick="switchTab('clientes')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span>Clientes</span>
      </button>
      <button id="btn-pedidos" class="nav-btn" onclick="switchTab('pedidos')">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
        <span>Pedidos</span>
        <span id="badge-cola" class="badge">0</span>
      </button>
    </div>
  </nav>

  <!-- ═══ MODAL INSTALAR (primera vez) ═══ -->
  <div id="install-modal">
    <div class="card">
      <img src="./ml-icon-192.png" alt="">
      <h2>Instalá la app</h2>
      <p>Se agrega a la pantalla del celular como una app: abre al toque, sin buscar el link, y funciona aunque no haya señal.</p>
      <button type="button" class="im-go" id="im-go">Instalar ahora</button>
      <div class="im-manual" id="im-manual"></div>
      <button type="button" class="im-later" id="im-later">Ahora no</button>
    </div>
  </div>

  <script>
    const dock = document.getElementById('dock');
    const apps = {
      clientes: document.getElementById('app-clientes'),
      pedidos:  document.getElementById('app-pedidos')
    };
    const btns = {
      clientes: document.getElementById('btn-clientes'),
      pedidos:  document.getElementById('btn-pedidos')
    };

    // ── Carga diferida: solo se carga una app al abrir; la otra, al primer uso ──
    function ensureLoaded(key) {
      const f = apps[key];
      if (!f.src) {
        f.src = f.dataset.src;
        f.addEventListener('load', () => { wireAutoHide(f); kickReflowTactil(f); });
      }
    }

    // Fuerza a Android/Chrome a recalcular la "zona táctil" de scroll del
    // iframe: cuando un iframe recibe su src o vuelve a mostrarse DESPUÉS
    // del primer pintado de la página, algunos Chrome/Android no
    // recomponen bien esa zona — se ve perfecto pero el dedo no engancha
    // el scroll. Alternar display en dos frames distintos fuerza un
    // repintado real que resuelve el desajuste.
    function kickReflowTactil(el) {
      el.style.display = 'none';
      requestAnimationFrame(() => {
        void el.offsetHeight;   // forzar reflow síncrono
        requestAnimationFrame(() => { el.style.display = ''; });
      });
    }

    // ── Cambiar de app (recuerda la elección) ──
    function switchTab(target) {
      ensureLoaded(target);
      Object.keys(apps).forEach(k => apps[k].classList.toggle('active', k === target));
      btns.clientes.classList.toggle('on-clientes', target === 'clientes');
      btns.pedidos.classList.toggle('on-pedidos',  target === 'pedidos');
      try { localStorage.setItem('ml_shell_tab', target); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(10);
      kickReflowTactil(apps[target]);
    }

    // ── Minimizar / expandir manual ──
    // userCollapsed: si el vendedor la escondió a mano, el auto-hide no la reabre.
    let userCollapsed = false;
    let autoCollapsed = false;
    function toggleDock() {
      userCollapsed = !dock.classList.contains('collapsed');
      autoCollapsed = false;
      dock.classList.toggle('collapsed');
      if (navigator.vibrate) navigator.vibrate(5);
    }
    function autoHide(on) {
      if (userCollapsed) return;                    // respetar la decisión manual
      if (on)  { dock.classList.add('collapsed');    autoCollapsed = true; }
      else if (autoCollapsed) { dock.classList.remove('collapsed'); autoCollapsed = false; }
    }

    // ── AUTO-HIDE 1: foco en campos de texto dentro de las apps ──
    // Shell y apps comparten dominio (github.io) → podemos escuchar el foco.
    function esCampoTexto(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      return tag === 'textarea' || tag === 'input' || tag === 'select' || el.isContentEditable;
    }
    function wireAutoHide(iframe) {
      try {
        const doc = iframe.contentDocument;
        if (!doc || doc.__mlWired) return;
        doc.__mlWired = true;
        doc.addEventListener('focusin',  (e) => { if (esCampoTexto(e.target)) autoHide(true); });
        doc.addEventListener('focusout', () => {
          setTimeout(() => { if (!esCampoTexto(doc.activeElement)) autoHide(false); }, 150);
        });
      } catch (e) { /* cross-origin (solo en desarrollo local): usa el fallback */ }
    }

    // ── AUTO-HIDE 2 (fallback): el teclado achica el viewport visible ──
    if (window.visualViewport) {
      const vvBase = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', () => {
        const shrunk = vvBase - window.visualViewport.height > 140;
        autoHide(shrunk);
      });
    }

    // ── Badge "en cola": las apps comparten localStorage (mismo dominio) ──
    function refreshBadge() {
      try {
        const q = JSON.parse(localStorage.getItem('pedidosPendientes') || '[]');
        const b = document.getElementById('badge-cola');
        b.textContent = q.length;
        b.classList.toggle('show', q.length > 0);
      } catch (e) {}
    }
    setInterval(refreshBadge, 5000);

    // ── Arranque: recordar la última app usada ──
    let inicio = 'clientes';
    try { inicio = localStorage.getItem('ml_shell_tab') || 'clientes'; } catch (e) {}
    if (!apps[inicio]) inicio = 'clientes';
    switchTab(inicio);
    refreshBadge();

    // ── Service Worker del shell (network-first: se actualiza solo, abre offline) ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {});
      });
    }

    // ═══════════════════════════════════════════════════════════
    //  INSTALAR PWA — vive en el shell (se instala el CONTENEDOR,
    //  con las dos apps). El beforeinstallprompt de Android solo
    //  lo dispara la página de arriba, nunca un iframe.
    //  Barra sobre el dock: aparece SIEMPRE (fuera de la app ya
    //  instalada) hasta que instalen. Modal: solo la primera vez.
    // ═══════════════════════════════════════════════════════════
    (function installUX(){
      const KEY_SEEN = 'ml_shell_install_modal_seen';
      let deferredPrompt = null;

      const bar    = document.getElementById('install-bar');
      const modal  = document.getElementById('install-modal');
      const manual = document.getElementById('im-manual');
      const imGo   = document.getElementById('im-go');

      const isStandalone = () =>
        matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isAndroid = () => /android/i.test(navigator.userAgent);
      const seen = () => { try { return !!localStorage.getItem(KEY_SEEN); } catch(_) { return false; } };
      const markSeen = () => { try { localStorage.setItem(KEY_SEEN, '1'); } catch(_) {} };

      const manualText = () => isIOS()
        ? 'En iPhone: tocá <b>Compartir</b> (el cuadrado con la flecha ↑) y elegí <b>“Agregar a inicio”</b>.'
        : 'En Android: abrí el menú <b>⋮</b> del navegador (arriba a la derecha) y tocá <b>“Instalar app”</b> o <b>“Agregar a pantalla principal”</b>.';

      function showBar(){ if (!isStandalone()) bar.classList.add('show'); }
      function hideBar(){ bar.classList.remove('show'); }
      function closeModal(){ modal.classList.remove('show'); }
      function openModalManual(){
        imGo.style.display = 'none';
        manual.innerHTML = manualText();
        manual.style.display = 'block';
        modal.classList.add('show');
      }
      function openModalNativo(){
        imGo.style.display = '';
        manual.style.display = 'none';
        modal.classList.add('show');
      }

      async function instalar(){
        if (deferredPrompt){
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          if (outcome === 'accepted'){ hideBar(); closeModal(); }
          else { closeModal(); showBar(); }   // rechazó: la barra queda de recordatorio
          return;
        }
        openModalManual();   // sin evento nativo (iOS, Firefox, o Chrome que aún no lo ofrece)
      }

      // Chrome/Android: capturar instalabilidad
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showBar();
        if (!seen() && !isStandalone()) openModalNativo();
      });

      window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        hideBar(); closeModal();
      });

      document.getElementById('ib-go').addEventListener('click', instalar);
      imGo.addEventListener('click', instalar);
      document.getElementById('ib-x').addEventListener('click', hideBar); // solo esta sesión
      document.getElementById('im-later').addEventListener('click', () => { markSeen(); closeModal(); showBar(); });

      // Fuera de standalone en celular: mostrar la barra igual (~2.5s) por si
      // beforeinstallprompt no llegó, y en iOS abrir el modal la primera vez.
      if (!isStandalone() && (isAndroid() || isIOS())){
        setTimeout(() => {
          showBar();
          if (isIOS() && !seen()){ markSeen(); openModalManual(); }
        }, 2500);
      }
    })();
  </script>

</body>
</html>
