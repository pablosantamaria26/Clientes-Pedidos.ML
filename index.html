<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mercado Limpio</title>
  <meta name="theme-color" content="#EEF2F7">
  <link rel="manifest" href="./manifest.json">

  <style>
    /* ═══════════════════════════════════════════════════════
       SHELL — Mercado Limpio (Clientes + Pedidos)
       El dock ocupa espacio REAL de layout: nunca tapa las apps.
       Se esconde solo cuando el vendedor escribe (auto-hide).
       ═══════════════════════════════════════════════════════ */
    :root {
      --bg:        #EEF2F7;
      --dock-bg:   #FFFFFF;
      --border:    rgba(12, 20, 30, 0.10);
      --muted:     #8A94A2;
      --text:      #0E1620;
      --clientes:  #2E6BFF;   /* acento app Clientes (azul) */
      --pedidos:   #0BB37B;   /* acento app Pedidos (esmeralda) */
      --ink:       #04140E;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:      #0A0E14;
        --dock-bg: #10161F;
        --border:  rgba(255, 255, 255, 0.10);
        --muted:   #7C8794;
        --text:    #EAF0F6;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      /* Columna: escenario (flex:1) + dock (en flujo) → el dock NUNCA tapa.
         Alto = SOLO lo visible. Nada de min-height:100vh: en celulares el
         vh mide la ventana con la barra de URL oculta (más alto que lo
         visible) y empujaba el dock y el fondo de las apps fuera de la
         pantalla, sin scroll posible (overflow hidden). El fallback si no
         hay dvh es el height:100% de arriba. */
      display: flex;
      flex-direction: column;
      height: 100dvh;              /* alto visible real (acompaña la UI del navegador) */
      background: var(--bg);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── ESCENARIO: las dos apps ── */
    #stage { flex: 1 1 auto; position: relative; min-height: 0; }
    /* La capa inactiva se oculta con VISIBILITY (no solo opacity/pointer-events):
       en iPhone los iframes ignoran pointer-events:none para los TOQUES, y el
       iframe invisible de arriba se comía todo el táctil de la app activa
       (mouse andaba, dedo no). visibility:hidden sí lo saca del hit-testing
       y conserva el estado de la app sin recargarla. Tampoco usamos transform
       (scale) sobre iframes: rompe el hit-testing táctil en iOS. */
    .app-layer {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: 0;
      opacity: 0; pointer-events: none;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
      background: var(--bg);
    }
    .app-layer.active { opacity: 1; pointer-events: auto; visibility: visible; }

    /* ── DOCK (en el flujo del layout) ── */
    #dock {
      flex: 0 0 auto;
      background: var(--dock-bg);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 18px rgba(10, 20, 30, 0.06);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Tirita para minimizar/expandir — parte del dock, no flota sobre la app.
       Discreta con el banner abierto; llamativa (naranja + pulso) cuando
       está oculto, para que sea fácil de encontrar y volver a desplegar. */
    .grab {
      height: 26px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: background 0.3s;
    }
    .grab-pill {
      width: 40px; height: 4px;
      border-radius: 999px;
      background: var(--border);
      position: absolute;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .grab svg {
      width: 15px; height: 15px;
      stroke: var(--muted); stroke-width: 2.5; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.3s, stroke 0.3s;
      position: relative;
    }
    #dock.collapsed .grab svg { transform: rotate(180deg); }

    /* Oculto: la manija se vuelve un faro naranja con pulso suave */
    #dock.collapsed .grab {
      background: #FFB020;
      box-shadow: 0 -2px 16px rgba(255, 176, 32, 0.55);
      animation: grabGlow 2.2s ease-in-out infinite;
    }
    #dock.collapsed .grab-pill { background: rgba(4, 20, 14, 0.35); }
    #dock.collapsed .grab svg  { stroke: #1A1300; }
    @keyframes grabGlow {
      0%, 100% { box-shadow: 0 -2px 16px rgba(255, 176, 32, 0.40); }
      50%      { box-shadow: 0 -5px 26px rgba(255, 176, 32, 0.85); }
    }

    /* Botonera — colapsa a 0 sin salirse del flujo */
    .dock-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 58px;
      overflow: hidden;
      transition: height 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    #dock.collapsed .dock-btns { height: 0; }

    .nav-btn {
      background: transparent; border: none;
      color: var(--muted);
      font-family: inherit; font-weight: 800; font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; position: relative;
      height: 100%;
      transition: color 0.2s, background 0.2s;
    }
    .nav-btn + .nav-btn { border-left: 1px solid var(--border); }
    .nav-btn svg {
      width: 22px; height: 22px;
      stroke: currentColor; stroke-width: 2; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.15s;
    }
    .nav-btn:active svg { transform: scale(0.9); }

    .nav-btn.on-clientes {
      color: var(--clientes);
      background: linear-gradient(to top, rgba(46, 107, 255, 0.10), transparent);
      box-shadow: inset 0 -3px 0 var(--clientes);
    }
    .nav-btn.on-pedidos {
      color: var(--pedidos);
      background: linear-gradient(to top, rgba(11, 179, 123, 0.12), transparent);
      box-shadow: inset 0 -3px 0 var(--pedidos);
    }

    /* Badge: pedidos en cola sin sincronizar */
    .badge {
      position: absolute;
      top: 7px; right: calc(50% - 34px);
      min-width: 17px; height: 17px;
      padding: 0 4px;
      background: #FF5D5D; color: #fff;
      border-radius: 999px;
      font-size: 10px; font-weight: 800;
      display: none;
      align-items: center; justify-content: center;
      line-height: 1;
    }
    .badge.show { display: flex; }
  </style>
</head>
<body>

  <!-- ═══ ESCENARIO: las dos apps (misma origin en producción) ═══ -->
  <div id="stage">
    <iframe id="app-clientes" class="app-layer"
      data-src="https://pablosantamaria26.github.io/app-vendedores/"
      allow="geolocation; microphone; camera; fullscreen"></iframe>

    <iframe id="app-pedidos" class="app-layer"
      data-src="https://pablosantamaria26.github.io/App-Pedidos-ML/index.html"
      allow="geolocation; microphone; camera; fullscreen"></iframe>
  </div>

  <!-- ═══ DOCK (en el layout: nunca tapa la app) ═══ -->
  <nav id="dock">
    <div class="grab" onclick="toggleDock()" title="Ocultar / mostrar barra">
      <span class="grab-pill" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="dock-btns">
      <button id="btn-clientes" class="nav-btn" onclick="switchTab('clientes')">
        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>
        <span>Clientes</span>
      </button>
      <button id="btn-pedidos" class="nav-btn" onclick="switchTab('pedidos')">
        <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>
        <span>Pedidos</span>
        <span id="badge-cola" class="badge">0</span>
      </button>
    </div>
  </nav>

  <script>
    const dock = document.getElementById('dock');
    const apps = {
      clientes: document.getElementById('app-clientes'),
      pedidos:  document.getElementById('app-pedidos')
    };
    const btns = {
      clientes: document.getElementById('btn-clientes'),
      pedidos:  document.getElementById('btn-pedidos')
    };

    // ── Carga diferida: solo se carga una app al abrir; la otra, al primer uso ──
    function ensureLoaded(key) {
      const f = apps[key];
      if (!f.src) { f.src = f.dataset.src; f.addEventListener('load', () => wireAutoHide(f)); }
    }

    // ── Cambiar de app (recuerda la elección) ──
    function switchTab(target) {
      ensureLoaded(target);
      Object.keys(apps).forEach(k => apps[k].classList.toggle('active', k === target));
      btns.clientes.classList.toggle('on-clientes', target === 'clientes');
      btns.pedidos.classList.toggle('on-pedidos',  target === 'pedidos');
      try { localStorage.setItem('ml_shell_tab', target); } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(10);
    }

    // ── Minimizar / expandir manual ──
    // userCollapsed: si el vendedor la escondió a mano, el auto-hide no la reabre.
    let userCollapsed = false;
    let autoCollapsed = false;
    function toggleDock() {
      userCollapsed = !dock.classList.contains('collapsed');
      autoCollapsed = false;
      dock.classList.toggle('collapsed');
      if (navigator.vibrate) navigator.vibrate(5);
    }
    function autoHide(on) {
      if (userCollapsed) return;                    // respetar la decisión manual
      if (on)  { dock.classList.add('collapsed');    autoCollapsed = true; }
      else if (autoCollapsed) { dock.classList.remove('collapsed'); autoCollapsed = false; }
    }

    // ── AUTO-HIDE 1: foco en campos de texto dentro de las apps ──
    // Shell y apps comparten dominio (github.io) → podemos escuchar el foco.
    function esCampoTexto(el) {
      if (!el) return false;
      const tag = (el.tagName || '').toLowerCase();
      return tag === 'textarea' || tag === 'input' || tag === 'select' || el.isContentEditable;
    }
    function wireAutoHide(iframe) {
      try {
        const doc = iframe.contentDocument;
        if (!doc || doc.__mlWired) return;
        doc.__mlWired = true;
        doc.addEventListener('focusin',  (e) => { if (esCampoTexto(e.target)) autoHide(true); });
        doc.addEventListener('focusout', () => {
          setTimeout(() => { if (!esCampoTexto(doc.activeElement)) autoHide(false); }, 150);
        });
      } catch (e) { /* cross-origin (solo en desarrollo local): usa el fallback */ }
    }

    // ── AUTO-HIDE 2 (fallback): el teclado achica el viewport visible ──
    if (window.visualViewport) {
      const vvBase = window.visualViewport.height;
      window.visualViewport.addEventListener('resize', () => {
        const shrunk = vvBase - window.visualViewport.height > 140;
        autoHide(shrunk);
      });
    }

    // ── Badge "en cola": las apps comparten localStorage (mismo dominio) ──
    function refreshBadge() {
      try {
        const q = JSON.parse(localStorage.getItem('pedidosPendientes') || '[]');
        const b = document.getElementById('badge-cola');
        b.textContent = q.length;
        b.classList.toggle('show', q.length > 0);
      } catch (e) {}
    }
    setInterval(refreshBadge, 5000);

    // ── Arranque: recordar la última app usada ──
    let inicio = 'clientes';
    try { inicio = localStorage.getItem('ml_shell_tab') || 'clientes'; } catch (e) {}
    if (!apps[inicio]) inicio = 'clientes';
    switchTab(inicio);
    refreshBadge();

    // ── Service Worker del shell (network-first: se actualiza solo, abre offline) ──
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' }).catch(() => {});
      });
    }
  </script>

</body>
</html>
